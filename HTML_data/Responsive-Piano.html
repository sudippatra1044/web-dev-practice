<!Doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Piano</title>
    <link rel="stylesheet" href="../CSS_data/Responsive-Piano.css" />
  </head>
  <body>
    <main>
      <div class="piano">
        <img class="logo" src="https://cdn.freecodecamp.org/platform/universal/fcc_primary.svg" alt="freeCodeCamp Logo" />
        <div class="keys">
          <div class="white-key">
            <div class="black-key"></div>
          </div>
          <div class="white-key">
            <div class="black-key"></div>
          </div>
          <div class="white-key"></div>
          <div class="white-key">
            <div class="black-key"></div>
          </div>
          <div class="white-key">
            <div class="black-key"></div>
          </div>
          <div class="white-key">
            <div class="black-key"></div>
          </div>
          <div class="white-key"></div>
          <div class="white-key">
            <div class="black-key"></div>
          </div>
          <div class="white-key">
            <div class="black-key"></div>
          </div>
          <div class="white-key"></div>
          <div class="white-key">
            <div class="black-key"></div>
          </div>
          <div class="white-key">
            <div class="black-key"></div>
          </div>
          <div class="white-key">
            <div class="black-key"></div>
          </div>
          <div class="white-key"></div>
        </div>
      </div>
    </main>
  </body>
</html>
