<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="../CSS_data/registration-form.css">
</head>
<body>
  <div class="registration-form">
    <h1 class="alignment">Registration Form</h1>
    <p class="alignment">Please fill out this form with the required information</p>
    
    <form action="">
      <label for="first-name">Enter Your First Name:</label>
    <input 
        type="text" 
        id="first-name" 
        name="first-name" 
        required>

    <label for="last-name">Enter Your Last Name:</label>
    <input 
        type="text" 
        id="last-name" 
        name="last-name" 
        required>

    <label for="email">Enter Your Email:</label>
    <input 
        type="email" 
        id="email" 
        name="email" 
        required>

    <label for="password">Create a New Password:</label>
    <input 
        type="password" 
        id="password" 
        name="password" 
        required
        pattern="[a-z0-9]{10,}">

    <fieldset>
      <legend>Account type (required)</legend>
      <label for="personal" class="inline-block">
        <input 
          type="radio" 
          class="inline"  
          id="personal" 
          name="account-type" 
          value="personal"
          checked>
        Personal</label>
       
       <label for="business" class="inline-block">
        <input 
          type="radio" 
          class="inline" 
          id="business" 
          name="account-type" 
          value="business">
        Business</label>
    
    </fieldset>  

    <label for="picture-profile">Upload a profile picture:</label>
    <input 
        type="file" 
        id="picture-profile" 
        name="picture-profile">

    <label for="age">Input your age (years): </label> 
    <input
        type="number" 
        id="age" 
        name="age"
        min="13"
        max="120">   

    <label for="referrer">How did you hear about us?</label>
    <select 
        name="referrer" 
        id="referrer" 
        required>
      <option value="" selected disabled>(select one)</option>
      <option value="news">News</option>
      <option value="youtube-channel">YouTube Channel</option>
      <option value="forum">Forum</option>
      <option value="others">Others</option>
    </select>

    <label for="bio">Provide a bio:</label>
    <textarea 
        name="bio" 
        id="bio"
        placeholder="I like coding on the beach..."></textarea>

    <a href="" target="_blank">Read our terms and conditions</a>

    <label for="terms-and-conditions" class="inline-block">
      <input 
        type="checkbox" 
        class="inline" 
        id="terms-and-conditions" 
        name="terms-and-conditions" 
        value="yes"
        required>
      I accept the terms and conditions</label>

    <button type="submit">
      Submit
    </button>
    </form>    
  </div>
</body>
</html>
