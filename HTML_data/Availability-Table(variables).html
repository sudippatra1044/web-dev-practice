<!DOCTYPE html>
<html lang="en">    
  <head>
    <meta charset="UTF-8">
    <title>Availability Table</title>
    <link href="../CSS_data/Availability-Table(variables).css" rel="stylesheet" />   
  </head>

  <body>
    <h1>Availability Table</h1>
    <table>
      <thead>
        <tr>
          <th scope="col"></th>
          <th scope="col">Monday</th>
          <th scope="col">Tuesday</th>
          <th scope="col">Wednesday</th>
          <th scope="col">Thursday</th>
          <th scope="col">Friday</th>
        </tr>
      </thead>
      <tbody>

        <tr class="half">
          <th class="time" rowspan="2" scope="row">9 AM</th>
          <td class="available-1"></td>
          <td class="available-0"></td>
          <td class="available-3"></td>
          <td class="available-2"></td>
          <td class="available-5"></td>
        </tr>
        <tr class="sharp">
          <td class="available-2"></td>
          <td class="available-3"></td>
          <td class="available-1"></td>
          <td class="available-0"></td>
          <td class="available-0"></td>
        </tr>

        <tr class="half">
          <th class="time" rowspan="2" scope="row">10 AM</th>
          <td class="available-2"></td>
          <td class="available-2"></td>
          <td class="available-1"></td>
          <td class="available-0"></td>
          <td class="available-5"></td>
        </tr>
        <tr class="sharp">
          <td class="available-1"></td>
          <td class="available-0"></td>
          <td class="available-0"></td>
          <td class="available-2"></td>
          <td class="available-5"></td>

          <tr class="half">
          <th class="time" rowspan="2" scope="row">11 AM</th>
          <td class="available-5"></td>
          <td class="available-5"></td>
          <td class="available-4"></td>
          <td class="available-5"></td>
          <td class="available-2"></td>
        </tr>
        <tr class="sharp">
          <td class="available-0"></td>
          <td class="available-3"></td>
          <td class="available-3"></td>
          <td class="available-1"></td>
          <td class="available-4"></td>

          <tr class="half">
          <th class="time" rowspan="2" scope="row">12 AM</th>
          <td class="available-1"></td>
          <td class="available-5"></td>
          <td class="available-5"></td>
          <td class="available-5"></td>
          <td class="available-1"></td>
        </tr>
        <tr class="sharp">
          <td class="available-1"></td>
          <td class="available-4"></td>
          <td class="available-3"></td>
          <td class="available-4"></td>
          <td class="available-4"></td>

        <tr class="half">
          <th class="time" rowspan="2" scope="row">1 PM</th>
          <td class="available-0"></td>
          <td class="available-0"></td>
          <td class="available-4"></td>
          <td class="available-4"></td>
          <td class="available-3"></td>
        </tr>
        <tr class="sharp">
          <td class="available-1"></td>
          <td class="available-0"></td>
          <td class="available-2"></td>
          <td class="available-2"></td>
          <td class="available-4"></td>
          
        <tr class="half">
          <th class="time" rowspan="2" scope="row">2 PM</th>
          <td class="available-1"></td>
          <td class="available-4"></td>
          <td class="available-1"></td>
          <td class="available-1"></td>
          <td class="available-1"></td>
        </tr>
        <tr class="sharp">
          <td class="available-5"></td>
          <td class="available-0"></td>
          <td class="available-2"></td>
          <td class="available-3"></td>
          <td class="available-4"></td>
      </tbody>
    </table>
    <div id="legend">
      <span>Availability</span>
      <div id="legend-gradient"></div>
    </div>
  </body>
</html>
