<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feature Selection Pannel</title>
  <link rel="stylesheet" href="../CSS_data/Feature-Selection-Pannel.css">
</head>
  <body>
    <main>
      <h1>Feature Selection</h1>
      <div class="feature-selector">

        <div class="features">
          <input type="checkbox" id="cloud-storage" name="Feature">
          <label for="cloud-storage">
            <h2>Cloud Storage</h2>
            <p>100 Gigabyte secure storage</p>
          </label>
        </div>

        <div class="features">
          <input type="checkbox" id="dedicated-support" name="Feature">
          <label for="dedicated-support">
            <h2>Dedicated Support</h2>
            <p>24/7 customer help</p>
          </label>
        </div>

        <div class="features">
          <input type="checkbox" id="advanced-analytics" name="Feature">
          <label for="advanced-analytics">
            <h2>Advanced Analytics</h2>
            <p>Insights & reports</p>
          </label>
        </div>

        <div class="features">
          <input type="checkbox" id="custom-user-themes" name="Feature">
          <label for="custom-user-themes">
            <h2>Custom User Themes</h2>
            <p>Personalized dashboard design</p>
          </label>
        </div>

        <div class="features">
          <input type="checkbox" id="multi-user-collab" name="Feature">
          <label for="multi-user-collab">
            <h2>Multi-User Collab</h2>
            <p>Team access and sharing</p>
          </label>
        </div>

        <div class="features">
          <input type="checkbox" id="api-access" name="Feature">
          <label for="api-access">
            <h2>API Access</h2>
            <p>Integrate with your custom built tools</p>
          </label>
        </div>
        
      </div>
    </main>
  </body>
</html>
