<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Settings</title>
  <link rel="stylesheet" href="../CSS_data/game-settings-pannel.css">
</head>
<body>
  <div class="container">
    <h1>Game Settings</h1>

    <label for="sound-effects">
      <input 
        type="checkbox" 
        id="sound-effects" 
        name="game-settings"> 
      Sound Effects
    </label>

    <label for="background-music">
      <input 
        type="checkbox" 
        id="background-music" 
        name="game-settings"> 
      Background Music
    </label>

     <label for="hard-mode">
      <input 
          type="checkbox" 
          id="hard-mode" 
          name="game-settings"> 
      Hard Mode
    </label>

    <label for="haptic-feedback">
      <input 
        type="checkbox" 
        id="haptic-feedback" 
        name="game-settings"> 
      Haptic feedback
    </label>

  </div>
</body>
</html>
