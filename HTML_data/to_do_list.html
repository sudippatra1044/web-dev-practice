<!DOCTYPE html>
 <html lang="en">
 <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Blog post card</title>
     <link rel="stylesheet" href="../CSS_data/to_do_list.css">
 </head>

<body>
    <div class="my-todo-list">
        <h2 class="todo-list-title">My To-Do List</h2>
        <ul class="todo-list">
            <li class="box">
                <input type="checkbox" name="gym" id="gym">
                <label for="gym">Hitting the Gym</label>
                <ul class="sub-item">
                <li>
                    <a class="sub-item-link" href="/" target="_blank">Gym Report</a>
                </li>
            </ul>
            </li>

            <li class="box">
                <input type="checkbox" name="study" id="study">
                <label for="study">Study for 5hrs</label>
                <ul class="sub-item">
                <li>
                    <a class="sub-item-link" href="/" target="_blank">Study Report</a>
                </li>
            </ul>
            </li>

            <li class="box">
                <input type="checkbox" name="work" id="work">
                <label for="work">Work for 8hrs</label>
                <ul class="sub-item">
                <li>
                    <a class="sub-item-link" href="/" target="_blank">Work Report</a>
                </li>
            </ul>
            </li>
            
            <li class="box">
                <input type="checkbox" name="drinking-water" id="drinking-water">
                <label for="drinking-water">Daily drink 2l Water</label>
                <ul class="sub-item">
                <li>
                    <a class="sub-item-link" href="/" target="_blank">Water Report</a>
                </li>
            </ul>
            </li>
        </ul>
    </div>
</body>
</html>
