<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Iframe practice</h1>
    <p>Let's practice &lt;iframe&gt; element</p>
    <section>
        <h2>1st iframe: Google map</h2>
        <section>
            <iframe 
                title="VR mall map"
                width="100%"
                height="700"
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d29772.0843493799!2d79.10610123303216!3d21.13207120685981!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bd4c172fe26f1d3%3A0xb93dfb1374ff0968!2sVR%20Nagpur!5e0!3m2!1sen!2sin!4v1778159470091!5m2!1sen!2sin" width="600" height="450" ;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
                allow="accelerometer; autoplay; clipboard-write; media-encrypted; gyroscope; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen
                style="border:2px solid gray; box-shadow:10px 10px 10px grey; border-radius: 5px;"
                scrolling="no">
            </iframe>
        </section>
        <section>
            <h2>2nd iframe: A website</h2>
            <iframe 
                title="VR mall map"
                width="100%"
                height="700"
                src="https://www.kalistajewels.com/"
                allow="accelerometer; autoplay; clipboard-write; media-encrypted; gyroscope; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen
                style="border:2px solid gray; box-shadow:10px 10px 10px grey; border-radius: 5px;">
            </iframe>
        </section>
        <section>
            <h2>3rd iframe: Youtube video</h2>
            <iframe 
                title="VR mall map"
                width="100%"
                height="700"
                src="https://www.youtube.com/embed/SX_ViT4Ra7k?si=j-3uZRcUJw4qNh8R" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen"
                allow="accelerometer; autoplay; clipboard-write; media-encrypted; gyroscope; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen
                style="border:2px solid gray; box-shadow:10px 10px 10px grey; border-radius: 5px;">
            </iframe>
        </section>
        <section>
            <h2>4th iframe: Video on local desktop</h2>
            <iframe 
                title="VR mall map"
                width="100%"
                height="700"
                src="../Media_data/videopractice.mp4"
                allow="accelerometer; clipboard-write; media-encrypted; gyroscope; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen
                style="border:2px solid gray; box-shadow:10px 10px 10px grey; border-radius: 5px;">
            </iframe>
        <section>
            </section>
            <h2>5th iframe: Local html file</h2>
                <div style="display:flex; gap:20px;">
                    <iframe src="Scalable-graphic-vector.html" width="50%" height="700" style="border:8px solid blue;"></iframe>
                    <iframe src="Scalable-graphic-vector.html" width="50%" height="700" style="border:8px solid red;"></iframe>
                </div>
            </section>
        <section>
            <h2>6th iframe: Local target practicing html file</h2>
            <iframe

                src="target_learning.html">

        </section>
    </section>
