<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Target_attribute_practice</title>
</head>
<body>
    <header><h1>Link</h1></header>
    <main>
        <!--!open in iframe practice.html for learning-->
        <a href="https://www.kalistajewels.com/" target="_blank">
            blank
        </a><br>

        </a><br>

            parent
        </a><br>
        <a href="https://www.kalistajewels.com/" target="_top">
            top
        </a><br>
        <a href="https://www.kalistajewels.com/">
            nothing
        </a><br>
    </main>
</body>
</html>
