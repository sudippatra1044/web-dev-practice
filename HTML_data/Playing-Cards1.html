<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Cards1</title>
  <link rel="stylesheet" href="../CSS_data/Playing-Cards1.css">
</head>
  <body>
    <main id="playing-cards">

      <div 
        class="card spade" aria-label="Ace of Spades">
        <div class="left">
          <div>A</div>
          <div>♠</div>
        </div>
        <div class="middle">
          <div>♠</div>
        </div>
        <div class="right">
          <div>♠</div>
          <div>A</div>
        </div>
      </div>
      
      <div class="card club" aria-label="two of club">
        <div class="left">
          <div>2</div>
          <div>♣</div>
        </div>
        <div class="middle">
          <div>♣</div>
          <div>♣</div>
        </div>
        <div class="right">
          <div>♣</div>
          <div>2</div>
        </div>
      </div>

      <div class="card heart" aria-label="three of heart">
        <div class="left">
          <div>3</div>
          <div>♥</div>
        </div>
        <div class="middle">
          <div>♥</div>
          <div>♥</div>
          <div>♥</div>
        </div>
        <div class="right">
          <div>♥</div>
          <div>3</div>
        </div>
      </div>

      <div class="card club" aria-label="four of club">
        <div class="left">
          <div>4</div>
          <div>♣</div>
        </div>
        <div class="middle">
          <div>♣♣</div>
          <div>♣♣</div>
        </div>
        <div class="right">
          <div>♣</div>
          <div>4</div>
        </div>
      </div>

      <div class="card diamond" aria-label="five of diamond">
        <div class="left">
          <div>5</div>
          <div>♦</div>
        </div>
        <div class="middle">
          <div>♦♦</div>
          <div>♦</div>
          <div>♦♦</div>
        </div>
        <div class="right">
          <div>♦</div>
          <div>5</div>
        </div>
      </div>

    </main>
  </body>
</html>
